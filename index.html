<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominação Overgrown</title>
    <style>
        /* Paleta baseada na identidade visual Overgrown */
        :root {
            --bg-color: #2b3026;
            --card-bg: #1c2118;
            --text-main: #e0e4d8;
            --text-muted: #8e9a83;
            --accent-green: #6b8e23;
            --btn-connect: #556b2f;
            --btn-start: #455d21;
            --btn-pause: #b08d57;
            --btn-danger: #8a3324;
            --amarelo: #d4b84c;
            --azul: #4a7c8c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 15px; 
            margin: 0; 
        }
        
        h1 { 
            text-align: center; 
            margin: 5px 0; 
            font-size: 24px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            color: var(--accent-green);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .status-bar { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.85em; 
            margin-bottom: 15px; 
            font-weight: bold;
        }
        
        .btn-connect { 
            background: var(--btn-connect); 
            color: var(--text-main); 
            width: 100%; 
            border: 2px solid #3e4d23; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 16px; 
            padding: 12px; 
            margin-bottom: 20px; 
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid #3e4d23; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 25px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        .dash-status { 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: var(--text-main); 
            padding: 8px; 
            border-radius: 5px; 
            background: #11140e; 
            border: 1px solid #3e4d23;
        }
        
        .times-container { 
            display: flex; 
            justify-content: space-between; 
            gap: 10px; 
        }
        
        .time-box { 
            flex: 1; 
            padding: 15px 5px; 
            border-radius: 6px; 
            font-size: 24px; 
            font-weight: bold; 
            font-family: monospace; 
            background: #11140e;
        }
        
        .time-amarelo { 
            color: var(--amarelo); 
            border: 1px solid var(--amarelo); 
        }
        
        .time-azul { 
            color: var(--azul); 
            border: 1px solid var(--azul); 
        }
        
        .dash-battery { 
            font-size: 12px; 
            color: var(--text-muted); 
            margin-top: 15px; 
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid #3e4d23;
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 12px; 
        }
        
        .card label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-size: 14px; 
            text-transform: uppercase;
        }
        
        .row { display: flex; gap: 10px; }
        
        input[type="number"] { 
            flex: 1; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #3e4d23; 
            background: #11140e; 
            color: var(--text-main); 
            font-size: 16px; 
            text-align: center; 
        }
        
        button { 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            text-transform: uppercase;
        }
        
        .btn-send { background: var(--accent-green); color: var(--text-main); padding: 0 20px; }
        
        .action-row { 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            margin-top: 20px; 
        }
        
        .action-row-horizontal {
            display: flex;
            gap: 10px;
        }

        .btn-start { background: var(--btn-start); color: var(--text-main); padding: 15px; width: 100%; border: 1px solid var(--accent-green);}
        .btn-warning { background: var(--btn-pause); color: #1a1a1a; flex: 1; padding: 15px; }
        .btn-danger { background: var(--btn-danger); color: var(--text-main); flex: 1; padding: 15px; }
    </style>
</head>
<body>

    <h1>DOMINAÇÃO OVERGROWN</h1>
    <div class="status-bar" id="statusText">STATUS: DESCONECTADO</div>
    <button class="btn-connect" id="btnConnect" onclick="connectBLE()">CONECTAR AO PROP</button>

    <div class="dashboard">
        <div class="dash-status" id="dashStatus">AGUARDANDO DADOS...</div>
        <div class="times-container">
            <div class="time-box time-amarelo">
                <div style="font-size: 10px; margin-bottom: 5px; color: #8e9a83;">AMARELO</div>
                <span id="tempoAmarelo">00:00</span>
            </div>
            <div class="time-box time-azul">
                <div style="font-size: 10px; margin-bottom: 5px; color: #8e9a83;">AZUL</div>
                <span id="tempoAzul">00:00</span>
            </div>
        </div>
        <div class="dash-battery" id="dashBattery">BATERIA: --%</div>
    </div>

    <div class="card">
        <label>Tempo de Vitória (Minutos)</label>
        <div class="row">
            <input type="number" id="inputVitoria" value="15" min="1">
            <button class="btn-send" onclick="sendData('V')">Salvar</button>
        </div>
    </div>

    <div class="card">
        <label>Contagem Pré-jogo (Minutos)</label>
        <div class="row">
            <input type="number" id="inputPreJogo" value="5" min="1">
            <button class="btn-send" onclick="sendData('P')">Salvar</button>
        </div>
    </div>

    <div class="card">
        <label>Brilho dos LEDs (%)</label>
        <div class="row">
            <input type="number" id="inputBrilho" value="100" min="1" max="100">
            <button class="btn-send" onclick="sendData('B')">Salvar</button>
        </div>
    </div>

    <div class="action-row">
        <button class="btn-start" onclick="sendAction('I')">▶ INÍCIO FORÇADO</button>
        <div class="action-row-horizontal">
            <button class="btn-warning" onclick="sendAction('Z')">⏸ PAUSAR</button>
            <button class="btn-danger" onclick="sendAction('R')">🔄 REINICIAR</button>
        </div>
    </div>

    <script>
        const bleService = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const bleCharRX = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; 
        const bleCharTX = "8a892b15-9776-464f-b6df-205105260b4a"; 

        let bleDevice, characteristicRX, characteristicTX;

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let min = Math.floor(totalSec / 60);
            let sec = totalSec % 60;
            return min.toString().padStart(2, '0') + ':' + sec.toString().padStart(2, '0');
        }

        async function connectBLE() {
            try {
                document.getElementById('statusText').innerText = 'STATUS: PROCURANDO...';
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "OVERGROWN_PROP" }],
                    optionalServices: [bleService]
                });

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('statusText').innerText = 'STATUS: DESCONECTADO';
                    document.getElementById('btnConnect').innerText = 'RECONECTAR';
                    document.getElementById('dashStatus').innerText = 'CONEXÃO PERDIDA';
                    document.getElementById('dashStatus').style.background = '#8a3324';
                    document.getElementById('dashStatus').style.color = '#e0e4d8';
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(bleService);
                
                characteristicRX = await service.getCharacteristic(bleCharRX);
                characteristicTX = await service.getCharacteristic(bleCharTX);

                await characteristicTX.startNotifications();
                characteristicTX.addEventListener('characteristicvaluechanged', handleTelemetry);

                document.getElementById('statusText').innerText = 'STATUS: CONECTADO';
                document.getElementById('btnConnect').innerText = 'CONECTADO';
            } catch (error) {
                console.error(error);
                document.getElementById('statusText').innerText = 'STATUS: ERRO NA CONEXÃO';
            }
        }

        function handleTelemetry(event) {
            const value = new TextDecoder().decode(event.target.value);
            const parts = value.split(',');
            
            if (parts.length >= 4) {
                const estado = parseInt(parts[0]);
                const timeAmarelo = parseInt(parts[1]);
                const timeAzul = parseInt(parts[2]);
                const bateria = parseInt(parts[3]);

                document.getElementById('tempoAmarelo').innerText = formatTime(timeAmarelo);
                document.getElementById('tempoAzul').innerText = formatTime(timeAzul);
                document.getElementById('dashBattery').innerText = `BATERIA: ${bateria}%`;

                const elStatus = document.getElementById('dashStatus');
                elStatus.style.color = '#11140e';

                switch(estado) {
                    case 0: elStatus.innerText = "PRÉ-JOGO"; elStatus.style.background = '#8e9a83'; break;
                    case 1: elStatus.innerText = "JOGO LIVRE"; elStatus.style.background = '#6b8e23'; break;
                    case 2: elStatus.innerText = "DOMÍNIO AMARELO"; elStatus.style.background = '#d4b84c'; break;
                    case 3: elStatus.innerText = "DOMÍNIO AZUL"; elStatus.style.background = '#4a7c8c'; break;
                    case 4: elStatus.innerText = "FIM DE JOGO"; elStatus.style.background = '#e0e4d8'; break;
                    case 6: elStatus.innerText = "JOGO PAUSADO"; elStatus.style.background = '#b08d57'; break;
                    default: elStatus.innerText = "DESCONHECIDO"; elStatus.style.background = '#11140e'; elStatus.style.color = '#e0e4d8'; break;
                }
            }
        }

        async function sendData(prefix) {
            if (!characteristicRX) return alert("Conecte-se primeiro!");
            let val = "";
            if(prefix === 'V') val = document.getElementById('inputVitoria').value;
            if(prefix === 'P') val = document.getElementById('inputPreJogo').value;
            if(prefix === 'B') val = document.getElementById('inputBrilho').value;
            
            const payload = prefix + "," + val;
            await characteristicRX.writeValue(new TextEncoder().encode(payload));
        }

        async function sendAction(command) {
            if (!characteristicRX) return alert("Conecte-se primeiro!");
            await characteristicRX.writeValue(new TextEncoder().encode(command));
        }
    </script>
</body>
</html>
