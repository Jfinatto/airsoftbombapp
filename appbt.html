<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Control - Overgrown</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; margin: 0; }
        h1 { color: #00ff88; margin-bottom: 5px;}
        .status { color: #aaaaaa; font-size: 0.9em; margin-bottom: 20px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
        .card label { font-weight: bold; display: block; margin-bottom: 5px; color: #ddd; }
        .row { display: flex; gap: 10px; }
        input[type="number"] { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; }
        button { border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-send { background: #007bff; color: white; }
        .btn-send:active { background: #0056b3; }
        .btn-connect { background: #00ff88; color: #000; width: 100%; margin-bottom: 20px; padding: 15px; }
        .btn-danger { background: #ff4444; color: white; width: 100%; padding: 15px; margin-bottom: 10px; }
        .btn-warning { background: #ffbb33; color: black; width: 100%; padding: 15px; }
    </style>
</head>
<body>

    <h1>OVERGROWN CT</h1>
    <div class="status" id="statusText">Status: Desconectado</div>

    <button class="btn-connect" id="btnConnect" onclick="connectBLE()">Conectar ao Prop</button>

    <div class="card">
        <label>Tempo de Vitória (Minutos)</label>
        <div class="row">
            <input type="number" id="inputVitoria" value="15" min="1">
            <button class="btn-send" onclick="sendData('V')">Enviar</button>
        </div>
    </div>

    <div class="card">
        <label>Tempo de Pré-jogo (Minutos)</label>
        <div class="row">
            <input type="number" id="inputPreJogo" value="5" min="1">
            <button class="btn-send" onclick="sendData('P')">Enviar</button>
        </div>
    </div>

    <div class="card">
        <label>Brilho dos LEDs (%)</label>
        <div class="row">
            <input type="number" id="inputBrilho" value="100" min="1" max="100">
            <button class="btn-send" onclick="sendData('B')">Enviar</button>
        </div>
    </div>

    <button class="btn-danger" onclick="sendAction('R')">FORÇAR REINÍCIO</button>
    <button class="btn-warning" onclick="sendAction('Z')">PAUSAR / RETOMAR</button>

    <script>
        const deviceName = "OVERGROWN_PROP";
        const bleService = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const bleCharacteristic = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice, characteristicOut;

        async function connectBLE() {
            try {
                document.getElementById('statusText').innerText = 'Status: Procurando...';
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: deviceName }],
                    optionalServices: [bleService]
                });

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('statusText').innerText = 'Status: Desconectado';
                    document.getElementById('btnConnect').innerText = 'Reconectar';
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(bleService);
                characteristicOut = await service.getCharacteristic(bleCharacteristic);

                document.getElementById('statusText').innerText = 'Status: Conectado!';
                document.getElementById('btnConnect').innerText = 'Conectado (Clique para Reconectar)';
            } catch (error) {
                console.error(error);
                document.getElementById('statusText').innerText = 'Status: Erro na Conexão';
            }
        }

        async function sendData(prefix) {
            if (!characteristicOut) return alert("Conecte-se primeiro!");
            let val = "";
            if(prefix === 'V') val = document.getElementById('inputVitoria').value;
            if(prefix === 'P') val = document.getElementById('inputPreJogo').value;
            if(prefix === 'B') val = document.getElementById('inputBrilho').value;
            
            const payload = prefix + "," + val;
            await characteristicOut.writeValue(new TextEncoder().encode(payload));
            alert("Enviado: " + payload);
        }

        async function sendAction(command) {
            if (!characteristicOut) return alert("Conecte-se primeiro!");
            await characteristicOut.writeValue(new TextEncoder().encode(command));
            // Feedback vibratório no celular se suportado
            if (navigator.vibrate) navigator.vibrate(200); 
        }
    </script>
</body>
</html>
